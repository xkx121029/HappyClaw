[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "octop"
version = "1.0.3b6"
description = "Self-hosted single-user AI assistant workspace: one local owner, multiple agents, built on happyclaw-harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{name = "xkx121029"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<2.14",
    "langchain-core>=1.4.8",
    "click>=8.1",
    "rich>=13.7",
    "questionary>=2.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "happyclaw-harness[all]>=1.0.14",
    "happyclaw-memory>=1.0.7",
    "lark-oapi>=1.7.3",
    "happyclaw-gateway>=1.0.6",
    "cryptography>=41",
    "scalar-fastapi>=1.0",
    "edge-tts>=6.1",
    "segno>=1.6",
    "websockets>=13.0",
    # websockets raises "python-socks is required to use a SOCKS proxy" when
    # the host has a SOCKS proxy env and this package is absent — the browser
    # host's CDP connection then fails to attach.
    "python-socks>=2.4",
    "acme>=5.6.0",
    "josepy>=2.2.0",
    "boto3>=1.40.61",
    "google-api-python-client>=2.100",
    "happyclaw-browser>=1.0.2",
    "playwright>=1.40",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.9,<2",
    "pillow>=13.0.0",
    "pypdf>=5.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0",
    "pypinyin>=0.53",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "ldap3>=2.9.1",
    "firecrawl-anydoc>=0.2.4",
    "tencentcloud-sdk-python>=3.1.166",
    "pyotp>=2.10.0",
    "webauthn>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/xkx121029/HappyClaw"
Repository = "https://github.com/xkx121029/HappyClaw"
Issues = "https://github.com/xkx121029/HappyClaw/issues"
Documentation = "https://github.com/xkx121029/HappyClaw/tree/main/docs"
Changelog = "https://github.com/xkx121029/HappyClaw/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# PEP 621 extras — kept so `pip install -e ".[dev]"` keeps working for
# legacy / CI flows. `uv sync` reads `[dependency-groups].dev` below.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
]
# Kept for backward compatibility; playwright is now a core dependency.
browser = [
    "playwright>=1.40",
]
# Volcengine TOS object storage (Admin storage kind ``tos``).
tos = ["tos>=2.9,<3"]
# Kept for backward compatibility; pillow is now a core dependency.
desktop = ["mss>=9.0", "pynput>=1.7"]
# Local ONNX / fastembed embedding models (Models admin local tab).
local-embedding = ["fastembed>=0.4", "huggingface_hub>=0.20"]
knowledge-ocr = [
    "rapidocr>=3.4,<4",
    "onnxruntime>=1.17",
    "pymupdf>=1.24",
    "shapely>=2.2.0",
]

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`. Mirrors the
# `[project.optional-dependencies].dev` list above.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-testmon>=2.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.0",
    "xlwt>=1.3",
]

[project.scripts]
# `happyclaw` is the product command; `octop` stays as an alias so existing
# scripts and docs keep working.
happyclaw = "happyclaw.cli.main:cli"
octop = "happyclaw.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/happyclaw"]

[tool.hatch.build]
include = [
    "src/happyclaw/**/*.py",
    "src/happyclaw/**/*.json",
    "src/happyclaw/**/*.md",
    "src/happyclaw/**/*.sql",
    "src/happyclaw/**/*.sh",
    "src/happyclaw/**/*.png",
    "src/happyclaw/dashboard/**/*",
    "src/happyclaw/infra/agents/experts/library/**/*",
    "src/happyclaw/infra/agents/plugins/bundled/**/*",
    "src/happyclaw/infra/agents/subagents/library/**/*",
    "src/happyclaw/infra/agents/subagents/divisions.json",
    "src/happyclaw/infra/control/desktop/scripts/**/*",
]
artifacts = [
    "src/happyclaw/dashboard/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/happyclaw/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/happyclaw"]
exclude = [
    "src/happyclaw/dashboard/",
    "src/happyclaw/infra/agents/experts/library/",
    "src/happyclaw/infra/agents/plugins/bundled/",
    "src/happyclaw/infra/agents/subagents/library/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.auth"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.health"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.setup"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.users"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.agents"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.providers"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.chat"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.channels"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.cron"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.routers.admin"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.api.app"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "happyclaw.infra.utils.posix_compat"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "happyclaw.infra.utils.subprocess_io_win"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that hit real LLM / external services (skipped by default)",
    "slow: expensive tests (integration boot, real harness, browser); skipped by make test-fast",
    "postgresql: tests that need a live PostgreSQL (set OCTOP_TEST_DATABASE_URL)",
]
# The project pins a starlette fork (1.3.1) whose TestClient prefers a
# private ``httpx2`` build that is not installable from PyPI. When ``httpx2``
# is absent it falls back to ``httpx`` and emits a non-actionable
# StarletteDeprecationWarning on every ``starlette.testclient`` import. The
# fallback is intentional for this environment, so silence the noise.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.uv.sources]
# The four HappyClaw libraries are not on PyPI. They ship as wheels vendored under
# vendor/happyclaw-libs/ so `uv sync --frozen` needs no index or network for them.
# Rebuild a wheel from the library repo's release tag and replace the file here.
happyclaw-harness = { path = "vendor/happyclaw-libs/happyclaw_harness-1.0.14-py3-none-any.whl" }
happyclaw-memory = { path = "vendor/happyclaw-libs/happyclaw_memory-1.0.7-py3-none-any.whl" }
happyclaw-gateway = { path = "vendor/happyclaw-libs/happyclaw_gateway-1.0.6-py3-none-any.whl" }
happyclaw-browser = { path = "vendor/happyclaw-libs/happyclaw_browser-1.0.2-py3-none-any.whl" }
