name: CI

# Pull requests only. GitHub runs PR checks on the merge result, so a push
# build on main would re-test content that the release / feature PR already
# proved green.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap structural guards. Both scripts are stdlib-only AST / regex scans that
  # finish in well under a second, so they get their own job ahead of every
  # install and suite: a broken invariant fails the PR at once instead of
  # hiding behind a twenty-minute test run. They need no uv sync and no venv,
  # which is why they call the scripts directly rather than going through make
  # (make would `uv run` them and pay for a resolve first).
  guards:
    name: "Guards (upstream refs, env compat)"
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Upstream reference check
        run: python3 scripts/check_no_upstream_refs.py

      - name: Env compat check
        run: python3 scripts/check_env_compat.py

  # Strict mypy over the whole package (812 files, 0 errors). Cold this takes
  # 30-40 minutes and warm 6-10, so it is its own job with its own caches
  # instead of a step inside a fast job or the local pre-commit hook. mypy does
  # not see the platform, so one runner covers both operating systems.
  mypy:
    name: "Type check (mypy --strict)"
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      # Re-analysing unchanged modules is what makes a cold run expensive, so
      # the incremental cache is worth more here than in any other job. Keyed
      # on the lock file so a dependency change starts clean; the restore-key
      # still seeds the first run after a lock bump.
      - name: Restore mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-py312-

      - name: Install dependencies
        run: make install

      - name: Type check
        run: make typecheck

  # The dashboard carried no CI at all: `tsconfig.app.json` excludes
  # *.test.ts(x) from `tsc -b`, so a broken test file was invisible to both the
  # type checker and the (nonexistent) suite. useChat.history.test.ts sat red
  # for days because nothing ever ran it. Types, lint, and tests each get their
  # own step so a failure names its cause instead of arriving as one blurred
  # red job.
  dashboard:
    name: "Dashboard (tsc, eslint, vitest)"
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      # Baselines at 0 errors / 76 warnings. The cap is the current count, not
      # zero: the existing warnings are real but not load-bearing, and pinning
      # them means a PR that adds one has to face it. The count can only go
      # down without touching this line.
      - name: Lint
        run: npx eslint . --max-warnings 76

      - name: Test
        run: npx vitest run
        # Generous on purpose. On the Windows dev box a single hook test needs
        # 346s and passes, so the default 5s per-test timeout cascades into a
        # wall of "Cannot read properties of null" failures that say nothing
        # about the code. The first CI run is the first trustworthy reading.
        timeout-minutes: 45

  quality:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    # Post-release main → develop sync PRs carry main's already-tested tree and
    # are auto-merged by the bot before checks finish. See sync-main-to-develop.
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      # ``make test`` collects tests/unit/api/test_acl_gate_coverage.py: the
      # ACL gate discovers route modules itself and fails on any module that is
      # neither gated nor exempt, so a new router cannot skip the guard.
      - name: Test
        run: make test

  test-windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    if: ${{ !startsWith(github.head_ref, 'chore/sync-develop-after-') }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  live-tests:
    name: "Live tests (real credentials)"
    runs-on: ubuntu-latest
    # Only the main repo may access secrets; fork PRs get none and must skip.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'chore/sync-develop-after-')
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      # Secrets are injected as env vars. Missing secrets => empty values =>
      # the live tests auto-skip (CI stays green). Never `echo`/print secrets.
      - name: Run live tests
        env:
          OPENAI_API_KEY: ${{ secrets.LIVE_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.LIVE_OPENAI_BASE_URL }}
          OPENAI_MODEL_NAME: ${{ secrets.LIVE_OPENAI_MODEL_NAME }}
          OSS_KIND: ${{ secrets.LIVE_OSS_KIND }}
          OSS_ENDPOINT: ${{ secrets.LIVE_OSS_ENDPOINT }}
          OSS_ACCESS_KEY: ${{ secrets.LIVE_OSS_ACCESS_KEY }}
          OSS_SECRET_KEY: ${{ secrets.LIVE_OSS_SECRET_KEY }}
          OSS_BUCKET: ${{ secrets.LIVE_OSS_BUCKET }}
          OSS_REGION: ${{ secrets.LIVE_OSS_REGION }}
          OSS_PREFIX: ${{ secrets.LIVE_OSS_PREFIX }}
          ALI_OSS_KIND: ${{ secrets.LIVE_ALI_OSS_KIND }}
          ALI_OSS_ENDPOINT: ${{ secrets.LIVE_ALI_OSS_ENDPOINT }}
          ALI_OSS_ACCESS_KEY: ${{ secrets.LIVE_ALI_OSS_ACCESS_KEY }}
          ALI_OSS_SECRET_KEY: ${{ secrets.LIVE_ALI_OSS_SECRET_KEY }}
          ALI_OSS_BUCKET: ${{ secrets.LIVE_ALI_OSS_BUCKET }}
          ALI_OSS_REGION: ${{ secrets.LIVE_ALI_OSS_REGION }}
          ALI_OSS_PREFIX: ${{ secrets.LIVE_ALI_OSS_PREFIX }}
          CONNECTOR_TENCENT_DOCS_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_DOCS_TOKEN }}
          CONNECTOR_TENCENT_MEETING_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_MEETING_TOKEN }}
          CONNECTOR_TENCENT_WEIYUN_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_WEIYUN_TOKEN }}
          CONNECTOR_YOUDAO_NOTE_TOKEN: ${{ secrets.LIVE_CONNECTOR_YOUDAO_NOTE_TOKEN }}
          CONNECTOR_TENCENT_NEWS_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_NEWS_TOKEN }}
          CONNECTOR_WECHAT_READING_TOKEN: ${{ secrets.LIVE_CONNECTOR_WECHAT_READING_TOKEN }}
          CONNECTOR_QQ_MUSIC_TOKEN: ${{ secrets.LIVE_CONNECTOR_QQ_MUSIC_TOKEN }}
          CONNECTOR_FLIGGY_TOKEN: ${{ secrets.LIVE_CONNECTOR_FLIGGY_TOKEN }}
          CONNECTOR_BAIDU_MAP_TOKEN: ${{ secrets.LIVE_CONNECTOR_BAIDU_MAP_TOKEN }}
          CONNECTOR_CTRIP_WENDAO_TOKEN: ${{ secrets.LIVE_CONNECTOR_CTRIP_WENDAO_TOKEN }}
          CONNECTOR_TENCENT_IMA_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_IMA_TOKEN }}
          CONNECTOR_TENCENT_IMA_CLIENT_ID: ${{ secrets.LIVE_CONNECTOR_TENCENT_IMA_CLIENT_ID }}
          CONNECTOR_TENCENT_LEXIANG_TOKEN: ${{ secrets.LIVE_CONNECTOR_TENCENT_LEXIANG_TOKEN }}
          CONNECTOR_TENCENT_LEXIANG_COMPANY_FROM: ${{ secrets.LIVE_CONNECTOR_TENCENT_LEXIANG_COMPANY_FROM }}
          CONNECTOR_MEITUAN_TRAVEL_TOKEN: ${{ secrets.LIVE_CONNECTOR_MEITUAN_TRAVEL_TOKEN }}
          CONNECTOR_YUANDIAN_TOKEN: ${{ secrets.LIVE_CONNECTOR_YUANDIAN_TOKEN }}
          # Channel probes (WeChat iLink + Feishu)
          WEIXIN_BOT_UIN: ${{ secrets.LIVE_WEIXIN_BOT_UIN }}
          WEIXIN_TOKEN: ${{ secrets.LIVE_WEIXIN_TOKEN }}
          WEIXIN_BASE_URL: ${{ secrets.LIVE_WEIXIN_BASE_URL }}
          FEISHU_APP_ID: ${{ secrets.LIVE_FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.LIVE_FEISHU_APP_SECRET }}
        run: make test-live
