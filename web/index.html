<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/happyclaw-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>HappyClaw</title>
    <script>
      // Resolve the theme before first paint so there is no light flash.
      try {
        var stored = localStorage.getItem("happyclaw.theme");
        var mode =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.classList.toggle("dark", mode === "dark");
        var locale = localStorage.getItem("happyclaw.locale") || "zh";
        document.documentElement.lang = locale === "en" ? "en" : "zh-CN";
      } catch (e) {
        /* storage unavailable: keep the dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
