<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">HappyClaw</title>
  <desc id="heroDesc">HappyClaw — a single-person AI workbench on your own machine, modified from Octop</desc>
  <style>
    :root{--bg:#FFFFFF;--ink:#1B1E26;--muted:#5B6270;--faint:#98A0AC;--line:#F1E2DA;--chip:#FFF6F2;--chipLine:#FFD9CB;--grid:#EFE3DD;}
    @media (prefers-color-scheme: dark){:root{--bg:#0F1117;--ink:#F2F4F8;--muted:#A7AEBB;--faint:#7B8390;--line:#2B313D;--chip:#1F161A;--chipLine:#4A2E26;--grid:#232833;}}
    .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .faint{fill:var(--faint)}
    .chip{fill:var(--chip);stroke:var(--chipLine);stroke-width:1}
    .txt{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
  </style>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A6B"/><stop offset="1" stop-color="#FF5A3C"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6B4A" stop-opacity="0.18"/><stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB38A" stop-opacity="0.16"/><stop offset="1" stop-color="#FFB38A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="var(--grid)"/>
    </pattern>
  </defs>
  <rect class="bg" width="1200" height="420" rx="28"/>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="none" stroke="var(--line)" stroke-opacity="0.7"/>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#dots)" opacity="0.55"/>
  <circle cx="150" cy="60" r="230" fill="url(#glowA)"/>
  <circle cx="1070" cy="370" r="250" fill="url(#glowB)"/>

  <g transform="translate(552 44) scale(0.8)">
    <rect width="120" height="120" rx="30" fill="url(#mark)"/>
    <path d="M82 34 A34 34 0 1 0 82 86" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
    <path d="M77 27 L99 29 L83 42 Z" fill="#FFFFFF"/>
    <path d="M77 93 L99 91 L83 78 Z" fill="#FFFFFF"/>
    <circle cx="50" cy="52" r="3.4" fill="#FFFFFF"/>
    <circle cx="70" cy="52" r="3.4" fill="#FFFFFF"/>
    <path d="M48 66 Q60 78 72 66" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <text class="txt" x="600" y="204" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="-0.5"><tspan class="ink">Happy</tspan><tspan fill="#FF6B4A">Claw</tspan></text>
  <text class="txt muted" x="600" y="246" text-anchor="middle" font-size="24">A single-person AI workbench on your own machine</text>
  <text class="txt faint" x="600" y="278" text-anchor="middle" font-size="16">One process for the web console, CLI, IM channels and scheduled jobs</text>

  <g class="txt" font-size="15">
    <rect class="chip" x="317" y="300" width="190" height="40" rx="20"/>
    <text class="muted" x="412" y="325" text-anchor="middle">Local-first · ~/.octop</text>
    <rect class="chip" x="521" y="300" width="120" height="40" rx="20"/>
    <text class="muted" x="581" y="325" text-anchor="middle">Python 3.12+</text>
    <rect class="chip" x="655" y="300" width="150" height="40" rx="20"/>
    <text class="muted" x="730" y="325" text-anchor="middle">Single process</text>
    <rect class="chip" x="819" y="300" width="64" height="40" rx="20"/>
    <text class="muted" x="851" y="325" text-anchor="middle">MIT</text>
  </g>

  <text class="txt faint" x="600" y="386" text-anchor="middle" font-size="13">Modified from TencentCloud/Octop · MIT License</text>
</svg>
