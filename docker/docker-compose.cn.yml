# =============================================================================
# HappyClaw — Docker Compose（国内镜像）
#
# 不在本地构建。官方 GHCR（ghcr.io/xkx121029/happyclaw）拉取失败时用本文件，
# 镜像来自南京大学 GHCR 源：ghcr.nju.edu.cn/xkx121029/happyclaw:latest
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.cn.yml up -d
#   HAPPYCLAW_PORT=9090 docker compose -f docker/docker-compose.cn.yml up -d
#   HAPPYCLAW_PORT=9090 docker compose -f docker/docker-compose.cn.yml up -d
#   (single-user: no account or password; legacy admin vars are not read)
#
# 环境变量与 docker-compose.yml 相同。docker/.env 仅用于 Compose 插值；
# 变量必须列在下方 environment 才会进入容器。
# =============================================================================

services:
  octop:
    image: ghcr.nju.edu.cn/xkx121029/happyclaw:latest
    container_name: octop
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Xvnc needs more than Docker's default 64MB /dev/shm after the user enables the desktop.
    shm_size: "1gb"
    ports:
      - "${HAPPYCLAW_PORT:-8088}:${HAPPYCLAW_PORT:-8088}"
    volumes:
      - ${HAPPYCLAW_DATA:-~/.octop}:/data/.octop
    environment:
      - HOME=/data
      - HAPPYCLAW_BIND_HOST=0.0.0.0
      - HAPPYCLAW_PORT=${HAPPYCLAW_PORT:-8088}
      - HAPPYCLAW_LOG_LEVEL=${HAPPYCLAW_LOG_LEVEL:-info}
      - HAPPYCLAW_DATABASE_URL=${HAPPYCLAW_DATABASE_URL:-}
      - HAPPYCLAW_DATABASE_DRIVER=${HAPPYCLAW_DATABASE_DRIVER:-}
      - HAPPYCLAW_DATABASE_SQLITE_PATH=${HAPPYCLAW_DATABASE_SQLITE_PATH:-}
      - HAPPYCLAW_DATABASE_HOST=${HAPPYCLAW_DATABASE_HOST:-}
      - HAPPYCLAW_DATABASE_PORT=${HAPPYCLAW_DATABASE_PORT:-}
      - HAPPYCLAW_DATABASE_NAME=${HAPPYCLAW_DATABASE_NAME:-}
      - HAPPYCLAW_DATABASE_USER=${HAPPYCLAW_DATABASE_USER:-}
      - HAPPYCLAW_DATABASE_PASSWORD=${HAPPYCLAW_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
